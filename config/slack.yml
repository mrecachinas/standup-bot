default: &default
  bot_token: <%= ENV.fetch('SLACK_BOT_TOKEN', nil) %>
  signing_secret: <%= ENV.fetch('SLACK_SIGNING_SECRET', nil) %>
  client_id: <%= ENV.fetch('SLACK_CLIENT_ID', nil) %>
  client_secret: <%= ENV.fetch('SLACK_CLIENT_SECRET', nil) %>

development:
  <<: *default

test:
  <<: *default
  # Clearly invalid defaults for tests; override with ENV only when needed.
  bot_token: <%= ENV.fetch('SLACK_BOT_TOKEN', 'xoxb-000000000000-0000000000000-TESTINVALIDTOKEN') %>
  signing_secret: <%= ENV.fetch('SLACK_SIGNING_SECRET', 'test-only-not-for-production-00000000') %>

production:
  <<: *default
