default: &default
  adapter: mysql2
  encoding: utf8mb4
  collation: utf8mb4_unicode_ci
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DB_HOST", "127.0.0.1") %>
  port: <%= ENV.fetch("DB_PORT", 3306) %>
  username: <%= ENV.fetch("DB_USER", "root") %>
  password: <%= ENV.fetch("DB_PASSWORD", "") %>

development:
  <<: *default
  database: nerdbot_development

test:
  <<: *default
  database: nerdbot_test

production:
  primary:
    adapter: postgresql
    encoding: unicode
    pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
    url: <%= ENV["DATABASE_URL"] %>
    host: <%= ENV.fetch("DB_HOST", "127.0.0.1") %>
    port: <%= ENV.fetch("DB_PORT", 5432) %>
    username: <%= ENV.fetch("DB_USER", "nerdbot") %>
    password: <%= ENV.fetch("DB_PASSWORD", "") %>
    database: <%= ENV.fetch("DB_NAME", "nerdbot_production") %>
  cache:
    adapter: postgresql
    encoding: unicode
    pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
    url: <%= ENV["CACHE_DATABASE_URL"] %>
    host: <%= ENV.fetch("CACHE_DB_HOST", ENV.fetch("DB_HOST", "127.0.0.1")) %>
    port: <%= ENV.fetch("CACHE_DB_PORT", ENV.fetch("DB_PORT", 5432)) %>
    username: <%= ENV.fetch("CACHE_DB_USER", ENV.fetch("DB_USER", "nerdbot")) %>
    password: <%= ENV.fetch("CACHE_DB_PASSWORD", ENV.fetch("DB_PASSWORD", "")) %>
    database: <%= ENV.fetch("CACHE_DB_NAME", "nerdbot_production_cache") %>
    migrations_paths: db/cache_migrate
  queue:
    adapter: postgresql
    encoding: unicode
    pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
    url: <%= ENV["QUEUE_DATABASE_URL"] %>
    host: <%= ENV.fetch("QUEUE_DB_HOST", ENV.fetch("DB_HOST", "127.0.0.1")) %>
    port: <%= ENV.fetch("QUEUE_DB_PORT", ENV.fetch("DB_PORT", 5432)) %>
    username: <%= ENV.fetch("QUEUE_DB_USER", ENV.fetch("DB_USER", "nerdbot")) %>
    password: <%= ENV.fetch("QUEUE_DB_PASSWORD", ENV.fetch("DB_PASSWORD", "")) %>
    database: <%= ENV.fetch("QUEUE_DB_NAME", "nerdbot_production_queue") %>
    migrations_paths: db/queue_migrate
  cable:
    adapter: postgresql
    encoding: unicode
    pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
    url: <%= ENV["CABLE_DATABASE_URL"] %>
    host: <%= ENV.fetch("CABLE_DB_HOST", ENV.fetch("DB_HOST", "127.0.0.1")) %>
    port: <%= ENV.fetch("CABLE_DB_PORT", ENV.fetch("DB_PORT", 5432)) %>
    username: <%= ENV.fetch("CABLE_DB_USER", ENV.fetch("DB_USER", "nerdbot")) %>
    password: <%= ENV.fetch("CABLE_DB_PASSWORD", ENV.fetch("DB_PASSWORD", "")) %>
    database: <%= ENV.fetch("CABLE_DB_NAME", "nerdbot_production_cable") %>
    migrations_paths: db/cable_migrate
