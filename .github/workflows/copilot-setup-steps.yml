name: Copilot Setup Steps

on:
  workflow_dispatch:

# Configuration for Copilot SWE Agent
# https://gh.io/copilot/actions-setup-steps
jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest

    permissions:
      id-token: write # for setup-ruby
      contents: read

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=5s --health-timeout=5s --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      
      - name: Install Ruby
        uses: ruby/setup-ruby@12fd324f1d0b43274fdc8130f6980590a667c455 # pin@v1.312.0
        with:
          bundler-cache: true
          
      - run: bundle install

      - name: Prepare database
        env:
          RAILS_ENV: test
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: ""
        run: bin/rails db:test:prepare
