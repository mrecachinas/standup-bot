name: Copilot Setup Steps

on:
  workflow_dispatch:

# Configuration for Copilot SWE Agent
# https://gh.io/copilot/actions-setup-steps
jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest

    permissions:
      id-token: write # for setup-ruby
      contents: read

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=5s --health-timeout=5s --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      
      - name: Install Ruby
        uses: ruby/setup-ruby@afeafc3d1ab54a631816aba4c914a0081c12ff2f # pin@v1.310.0
        with:
          bundler-cache: true
          
      - run: bundle install

      - name: Prepare database
        env:
          RAILS_ENV: test
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: ""
        run: bin/rails db:test:prepare
