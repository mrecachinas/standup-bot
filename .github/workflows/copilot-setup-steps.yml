name: Copilot Setup Steps

on:
  workflow_dispatch:

# Configuration for Copilot SWE Agent
# https://gh.io/copilot/actions-setup-steps
jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest

    permissions:
      id-token: write # for setup-ruby
      contents: read

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=5s --health-timeout=5s --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      
      - name: Install Ruby
        uses: ruby/setup-ruby@d45b1a4e94b71acab930e56e79c6aa188764e7f9 # pin@v1.316.0
        with:
          bundler-cache: true
          
      - run: bundle install

      - name: Prepare database
        env:
          RAILS_ENV: test
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: ""
        run: bin/rails db:test:prepare
