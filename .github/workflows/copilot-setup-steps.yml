name: Copilot Setup Steps

on:
  workflow_dispatch:

# Configuration for Copilot SWE Agent
# https://gh.io/copilot/actions-setup-steps
jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest

    permissions:
      id-token: write # for setup-ruby
      contents: read

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=5s --health-timeout=5s --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Install Ruby
        uses: ruby/setup-ruby@bec3f19a76460dbe12f60def7d1a77585f07516c # pin@v1.322.0
        with:
          bundler-cache: true
          
      - run: bundle install

      - name: Prepare database
        env:
          RAILS_ENV: test
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: ""
        run: bin/rails db:test:prepare
