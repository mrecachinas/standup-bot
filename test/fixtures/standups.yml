# created_at predates the dates tests report on, so analytics expect these
# standups and participants on every scheduled day.

# Fixture for daily standup
daily:
  created_at: 2024-01-01 00:00:00
  name: Daily Standup
  platform_channel: daily-standup
  questions:
    - What did you do yesterday?
    - What are you doing today?
    - Any blockers?
  schedule_type: daily
  default_hour: 9
  default_minute: 0
  respect_timezone: true
  active: true

# Fixture for weekdays standup
weekdays:
  created_at: 2024-01-01 00:00:00
  name: Weekdays Standup
  platform_channel: weekday-standup
  questions:
    - Current priorities?
    - Any updates?
  schedule_type: weekdays
  default_hour: 10
  default_minute: 30
  respect_timezone: false
  active: true

# Fixture for weekly standup
weekly:
  created_at: 2024-01-01 00:00:00
  name: Weekly Planning
  platform_channel: weekly-planning
  questions:
    - Goals for this week?
    - Wins from last week?
  schedule_type: weekly
  schedule_days:
    - 1 # Monday
  default_hour: 13
  default_minute: 0
  respect_timezone: true
  active: true

# Fixture for inactive standup
inactive:
  created_at: 2024-01-01 00:00:00
  name: Archived Standup
  platform_channel: archived-standup
  questions:
    - Some question
  schedule_type: daily
  default_hour: 9
  default_minute: 0
  respect_timezone: false
  active: false